[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "centella-football-intelligence"
version = "0.1.0"
description = "CENTELLA Football computer-vision and football-intelligence analytics stack"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
