name: CENTELLA Alfheim V59 OOS Anonymous Track-Set Consensus

on:
  push:
    branches: [centella-v24-football-intelligence]
    paths:
      - 'vision_v1/alfheim_benchmark_v59_oos_trackset_consensus.py'
      - '.github/workflows/centella-alfheim-v59-oos-trackset-consensus.yml'
  workflow_dispatch:

# re-run marker: 2026-09-11T11:xxZ
jobs:
  benchmark:
    name: V59 OOS anonymous track-set consensus 0059-0061
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics scipy pandas opencv-python-headless
      - name: Download OOS native segments 0059-0061 and truth
        run: |
          set -euxo pipefail
          BASE_PATH='/downloads/alfheim/2013-11-03/First%20Half'
          CURL=(curl -4 -fkL --connect-timeout 15 --max-time 180 --retry 2 --retry-all-errors --retry-delay 2)
          mkdir -p /tmp/oos output/alfheim_v59
          download() {
            local rel="$1" out="$2"
            local urls=(
              "https://datasets.simula.no${rel}"
              "http://datasets.simula.no${rel}"
              "https://webhotel.simula.no${rel}"
              "http://webhotel.simula.no${rel}"
            )
            local u
            for u in "${urls[@]}"; do
              echo "TRY $u"
              if "${CURL[@]}" "$u" -o "$out" && test -s "$out"; then
                echo "OK $u"
                return 0
              fi
              rm -f "$out"
            done
            for proto in https http; do
              local url="${proto}://128.39.36.14${rel}"
              echo "TRY $url via Host: datasets.simula.no"
              if [ "$proto" = https ]; then
                if curl -4 -fkL --connect-timeout 15 --max-time 180 --retry 2 --retry-all-errors --retry-delay 2 \
                  --resolve datasets.simula.no:443:128.39.36.14 "$url" -H 'Host: datasets.simula.no' -o "$out" && test -s "$out"; then return 0; fi
              else
                if curl -4 -fL --connect-timeout 15 --max-time 180 --retry 2 --retry-all-errors --retry-delay 2 \
                  "$url" -H 'Host: datasets.simula.no' -o "$out" && test -s "$out"; then return 0; fi
              fi
              rm -f "$out"
            done
            echo "ERROR unable to download $rel" >&2
            return 1
          }
          for cam in 0 1 2; do
            for spec in \
              '0059|0059_2013-11-03%2018%3A01%3A23.251115000.h264' \
              '0060|0060_2013-11-03%2018%3A01%3A26.252555000.h264' \
              '0061|0061_2013-11-03%2018%3A01%3A29.253030000.h264'; do
              seg="${spec%%|*}"; href="${spec#*|}"
              download "$BASE_PATH/$cam/$href" "/tmp/oos/cam${cam}_${seg}.h264"
            done
            cat "/tmp/oos/cam${cam}_0059.h264" "/tmp/oos/cam${cam}_0060.h264" "/tmp/oos/cam${cam}_0061.h264" > "/tmp/oos/cam${cam}.h264"
            ffmpeg -y -r 25 -i "/tmp/oos/cam${cam}.h264" -c:v libx264 -preset ultrafast -crf 22 -pix_fmt yuv420p "/tmp/oos/cam${cam}.mp4"
            test -s "/tmp/oos/cam${cam}.mp4"
          done
          download '/downloads/alfheim/2013-11-03/zxy/2013-11-03_tromso_stromsgodset_first.csv' /tmp/oos/truth.csv
          test -s /tmp/oos/truth.csv
      - name: Run V59 anonymous track-set consensus benchmark
        run: |
          set -euo pipefail
          python vision_v1/alfheim_benchmark_v59_oos_trackset_consensus.py \
            --cam0 /tmp/oos/cam0.mp4 --cam1 /tmp/oos/cam1.mp4 --cam2 /tmp/oos/cam2.mp4 \
            --truth /tmp/oos/truth.csv --out output/alfheim_v59 2>&1 | tee output/alfheim_v59/run.log
          cat output/alfheim_v59/metrics.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('output/alfheim_v59/metrics.json').read_text())
          assert m['inference_uses_ground_truth'] is False
          assert m['selected_tracks'] > 0
          assert m['anonymous_tracking_diagnostics']['evaluated_samples'] > 0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: centella-alfheim-v59-oos-trackset-consensus
          path: output/alfheim_v59/
          retention-days: 14
