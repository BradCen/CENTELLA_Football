name: CENTELLA Real Match Benchmark

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  youtube_probe:
    name: YouTube connectivity probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: Fetch real football video metadata
        run: |
          yt-dlp --no-playlist --dump-single-json 'https://www.youtube.com/watch?v=Rq4QD4vKjz8' > /tmp/video.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/video.json'))
          print('title=', x.get('title'))
          print('duration=', x.get('duration'))
          print('id=', x.get('id'))
          PY
      - name: Download a short real football clip
        run: |
          mkdir -p /tmp/centella
          yt-dlp --no-playlist -f 'bv*[height<=480]+ba/b[height<=480]/b' \
            --download-sections '*00:35:18-00:35:38' \
            --force-keyframes-at-cuts \
            --merge-output-format mp4 \
            -o '/tmp/centella/youtube_probe.%(ext)s' \
            'https://www.youtube.com/watch?v=Rq4QD4vKjz8'
          test -s /tmp/centella/youtube_probe.mp4
          ls -lh /tmp/centella/youtube_probe.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-probe
          path: /tmp/centella/
          if-no-files-found: ignore
          retention-days: 2

  smoke:
    name: Build + CENTELLA smoke test
    needs: youtube_probe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Rebuild CENTELLA Vision source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p vision_v1/runtime
          sha256sum vision_v1/source.part*.b64
          cat vision_v1/source.part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/centella_vision_source.zip
          echo '7cd06cfff028a816dbff9d4601f0ee280b80665179511417231ff60aaaac3d7e  /tmp/centella_vision_source.zip' | sha256sum -c -
          unzip -t /tmp/centella_vision_source.zip
          unzip -q /tmp/centella_vision_source.zip -d vision_v1/runtime
      - name: Install dependencies
        working-directory: vision_v1/runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[youtube,dev]'
          python -m pip install --upgrade yt-dlp
      - name: Unit tests
        working-directory: vision_v1/runtime
        run: pytest -q

  benchmark:
    name: Benchmark ${{ matrix.slug }}
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        slug: [argentina-france-2022, france-croatia-2018]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Rebuild CENTELLA Vision source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p vision_v1/runtime
          cat vision_v1/source.part*.b64 | tr -d '\n\r ' | base64 -d > /tmp/centella_vision_source.zip
          echo '7cd06cfff028a816dbff9d4601f0ee280b80665179511417231ff60aaaac3d7e  /tmp/centella_vision_source.zip' | sha256sum -c -
          unzip -q /tmp/centella_vision_source.zip -d vision_v1/runtime
      - name: Install dependencies
        working-directory: vision_v1/runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[youtube,dev]'
          python -m pip install --upgrade yt-dlp
      - name: Disable annotated-video render in CI
        working-directory: vision_v1/runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('centella_football/cli.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.analyze(str(video),str(out),True)', '.analyze(str(video),str(out),False)')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Run full-match benchmark
        working-directory: vision_v1/runtime
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p output/${{ matrix.slug }}
          python -m centella_football benchmark '${{ matrix.slug }}' \
            --out 'output/${{ matrix.slug }}' \
            --sample-fps 1.5 \
            --detector torchvision-fast \
            --tune | tee 'output/${{ matrix.slug }}/actions.log'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: centella-${{ matrix.slug }}
          path: vision_v1/runtime/output/${{ matrix.slug }}/
          if-no-files-found: warn
          retention-days: 7
