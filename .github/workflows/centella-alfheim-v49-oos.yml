name: CENTELLA Alfheim V49 OOS 0059-0061
# Force-run marker: every update to this workflow intentionally triggers the OOS benchmark.

on:
  push:
    branches: [centella-v24-football-intelligence]
    paths:
      - 'vision_v1/alfheim_benchmark_v49_oos.py'
      - 'vision_v1/alfheim_benchmark_v47.py'
      - 'vision_v1/alfheim_benchmark_v37.py'
      - 'vision_v1/alfheim_benchmark_v26.py'
      - 'vision_v1/alfheim_benchmark_v19.py'
      - 'vision_v1/alfheim_identity_diagnostic_v1.py'
      - '.github/workflows/centella-alfheim-v49-oos.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics scipy pandas opencv-python-headless
      - name: Download unseen native segment 0059-0061 and truth
        run: |
          set -euxo pipefail
          BASE='https://datasets.simula.no/downloads/alfheim/2013-11-03/First%20Half'
          CURL=(curl -4 -fkL --connect-timeout 30 --max-time 180 --retry 8 --retry-all-errors --retry-delay 3)
          mkdir -p /tmp/native output/alfheim_v49
          for cam in 0 1 2; do
            mkdir -p "/tmp/native/$cam"
            for seg in 0059 0060 0061; do
              html=$("${CURL[@]}" "$BASE/$cam/")
              href=$(printf '%s' "$html" | grep -oE "href=\"[^"]*${seg}_[^\"]+\.h264\"" | head -1 | sed -E 's/^href=\"//;s/\"$//')
              test -n "$href"
              echo "cam=$cam seg=$seg href=$href"
              "${CURL[@]}" "$BASE/$cam/$href" -o "/tmp/native/$cam/${seg}.h264"
              test -s "/tmp/native/$cam/${seg}.h264"
            done
            cat "/tmp/native/$cam/0059.h264" "/tmp/native/$cam/0060.h264" "/tmp/native/$cam/0061.h264" > "/tmp/native/cam${cam}.h264"
            ffmpeg -y -r 25 -i "/tmp/native/cam${cam}.h264" -c:v libx264 -preset ultrafast -crf 22 -pix_fmt yuv420p "/tmp/native/cam${cam}.mp4"
            test -s "/tmp/native/cam${cam}.mp4"
          done
          "${CURL[@]}" 'https://datasets.simula.no/downloads/alfheim/2013-11-03/zxy/2013-11-03_tromso_stromsgodset_first.csv' -o /tmp/native/truth.csv
          test -s /tmp/native/truth.csv
      - name: Run V49 unchanged V47 policy on OOS segment
        run: |
          set -euo pipefail
          python vision_v1/alfheim_benchmark_v49_oos.py \
            --cam0 /tmp/native/cam0.mp4 --cam1 /tmp/native/cam1.mp4 --cam2 /tmp/native/cam2.mp4 \
            --truth /tmp/native/truth.csv --out output/alfheim_v49 --sample-fps 8.0 \
            --calibration-seconds 3.0 --imgsz 1280 --model yolo11n.pt 2>&1 | tee output/alfheim_v49/run.log
          cat output/alfheim_v49/metrics.json
      - name: Diagnose OOS identity switches
        if: always()
        run: |
          set -euo pipefail
          if test -s output/alfheim_v49/matched_observations.csv; then
            python vision_v1/alfheim_identity_diagnostic_v1.py --rows output/alfheim_v49/matched_observations.csv --truth /tmp/native/truth.csv --out output/alfheim_v49
            cat output/alfheim_v49/identity_diagnostic.json
          fi
      - name: Upload OOS artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: centella-alfheim-v49-oos-0059-0061
          path: output/alfheim_v49/
          retention-days: 14
