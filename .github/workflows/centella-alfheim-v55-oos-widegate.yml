name: CENTELLA Alfheim V55 OOS Wide-Gate Anonymous Tracking
on:
  push:
    branches: [centella-v24-football-intelligence]
    paths:
      - 'vision_v1/alfheim_benchmark_v55_oos_robusttrack15.py'
      - '.github/workflows/centella-alfheim-v55-oos-widegate.yml'
  workflow_dispatch:
jobs:
  benchmark:
    name: V55 OOS wide-gate 0059-0061
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics scipy pandas opencv-python-headless
      - name: Download OOS native segments 0059-0061 and truth
        run: |
          set -euxo pipefail
          BASE='https://datasets.simula.no/downloads/alfheim/2013-11-03/First%20Half'
          CURL=(curl -4 -fkL --connect-timeout 30 --max-time 180 --retry 8 --retry-all-errors --retry-delay 3)
          mkdir -p /tmp/oos output/alfheim_v55
          for cam in 0 1 2; do
            for spec in \
              '0059|0059_2013-11-03%2018%3A01%3A23.251115000.h264' \
              '0060|0060_2013-11-03%2018%3A01%3A26.252555000.h264' \
              '0061|0061_2013-11-03%2018%3A01%3A29.253030000.h264'; do
              seg="${spec%%|*}"; href="${spec#*|}"
              "${CURL[@]}" "$BASE/$cam/$href" -o "/tmp/oos/cam${cam}_${seg}.h264"
              test -s "/tmp/oos/cam${cam}_${seg}.h264"
            done
            cat "/tmp/oos/cam${cam}_0059.h264" "/tmp/oos/cam${cam}_0060.h264" "/tmp/oos/cam${cam}_0061.h264" > "/tmp/oos/cam${cam}.h264"
            ffmpeg -y -r 25 -i "/tmp/oos/cam${cam}.h264" -c:v libx264 -preset ultrafast -crf 22 -pix_fmt yuv420p "/tmp/oos/cam${cam}.mp4"
            test -s "/tmp/oos/cam${cam}.mp4"
          done
          "${CURL[@]}" 'https://datasets.simula.no/downloads/alfheim/2013-11-03/zxy/2013-11-03_tromso_stromsgodset_first.csv' -o /tmp/oos/truth.csv
          test -s /tmp/oos/truth.csv
      - name: Run V55 wide-gate anonymous tracker
        run: |
          set -euo pipefail
          python vision_v1/alfheim_benchmark_v55_oos_robusttrack15.py \
            --cam0 /tmp/oos/cam0.mp4 --cam1 /tmp/oos/cam1.mp4 --cam2 /tmp/oos/cam2.mp4 \
            --truth /tmp/oos/truth.csv --out output/alfheim_v55 2>&1 | tee output/alfheim_v55/run.log
          cat output/alfheim_v55/metrics.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('output/alfheim_v55/metrics.json').read_text())
          assert m['inference_uses_ground_truth'] is False
          assert m['mapped_samples'] > 0
          assert m['mapped_tracks'] > 0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: centella-alfheim-v55-oos-widegate
          path: output/alfheim_v55/
          retention-days: 14
