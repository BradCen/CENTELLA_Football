name: CENTELLA Alfheim Accuracy Benchmark

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install ultralytics scipy pandas opencv-python-headless

      - name: Download 12 seconds fixed full-pitch video and 20 Hz truth
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/alfheim/segments /tmp/alfheim/data output/alfheim
          BASE='https://datasets.simula.no/downloads/alfheim/2013-11-03/First%20Half/panorama'
          CURL='curl -fkL --connect-timeout 20 --retry 4 --retry-all-errors --retry-delay 2'
          $CURL "$BASE/0035_2013-11-03%2018%3A01%3A12.794293000.h264" -o /tmp/alfheim/segments/0035.h264
          $CURL "$BASE/0036_2013-11-03%2018%3A01%3A15.793287000.h264" -o /tmp/alfheim/segments/0036.h264
          $CURL "$BASE/0037_2013-11-03%2018%3A01%3A18.793282000.h264" -o /tmp/alfheim/segments/0037.h264
          $CURL "$BASE/0038_2013-11-03%2018%3A01%3A21.793325000.h264" -o /tmp/alfheim/segments/0038.h264
          cat /tmp/alfheim/segments/*.h264 > /tmp/alfheim/data/panorama.h264
          ffmpeg -y -framerate 25 -i /tmp/alfheim/data/panorama.h264 -c:v libx264 -preset ultrafast -crf 24 /tmp/alfheim/data/panorama.mp4
          $CURL 'https://datasets.simula.no/downloads/alfheim/2013-11-03/zxy/2013-11-03_tromso_stromsgodset_first.csv' -o /tmp/alfheim/data/truth.csv

      - name: Run CENTELLA V3 benchmark
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python vision_v1/alfheim_benchmark_v3.py \
            --video /tmp/alfheim/data/panorama.mp4 \
            --truth /tmp/alfheim/data/truth.csv \
            --out output/alfheim \
            --sample-fps 4.0 \
            --calibration-seconds 3.0 \
            --model yolo11n.pt | tee output/alfheim/run.log
          cat output/alfheim/metrics.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: centella-alfheim-benchmark-v3
          path: output/alfheim/
          if-no-files-found: warn
          retention-days: 14
