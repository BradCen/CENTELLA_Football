name: CENTELLA Alfheim V23 Temporal Fusion Benchmark

on:
  push:
    branches: [centella-vision-benchmark]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CPU runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics scipy pandas opencv-python-headless

      - name: Download 30 seconds native cameras and 20 Hz truth
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://datasets.simula.no/downloads/alfheim/2013-11-03/First%20Half'
          CURL='curl -fkL --connect-timeout 20 --retry 4 --retry-all-errors --retry-delay 2'
          mkdir -p /tmp/alfheim/native output/alfheim
          for cam in 0 1 2; do
            mkdir -p "/tmp/alfheim/native/$cam"
            $CURL "$BASE/$cam/0056_2013-11-03%2018%3A01%3A14.248366000.h264" -o "/tmp/alfheim/native/$cam/0056.h264"
            $CURL "$BASE/$cam/0057_2013-11-03%2018%3A01%3A17.249311000.h264" -o "/tmp/alfheim/native/$cam/0057.h264"
            $CURL "$BASE/$cam/0058_2013-11-03%2018%3A01%3A20.250403000.h264" -o "/tmp/alfheim/native/$cam/0058.h264"
            $CURL "$BASE/$cam/0059_2013-11-03%2018%3A01%3A23.251115000.h264" -o "/tmp/alfheim/native/$cam/0059.h264"
            $CURL "$BASE/$cam/0060_2013-11-03%2018%3A01%3A26.252555000.h264" -o "/tmp/alfheim/native/$cam/0060.h264"
            $CURL "$BASE/$cam/0061_2013-11-03%2018%3A01%3A29.253030000.h264" -o "/tmp/alfheim/native/$cam/0061.h264"
            $CURL "$BASE/$cam/0062_2013-11-03%2018%3A01%3A32.253789000.h264" -o "/tmp/alfheim/native/$cam/0062.h264"
            $CURL "$BASE/$cam/0063_2013-11-03%2018%3A01%3A35.255057000.h264" -o "/tmp/alfheim/native/$cam/0063.h264"
            $CURL "$BASE/$cam/0064_2013-11-03%2018%3A01%3A38.255551000.h264" -o "/tmp/alfheim/native/$cam/0064.h264"
            $CURL "$BASE/$cam/0065_2013-11-03%2018%3A01%3A41.256419000.h264" -o "/tmp/alfheim/native/$cam/0065.h264"
            cat "/tmp/alfheim/native/$cam"/*.h264 > "/tmp/alfheim/native/cam${cam}.h264"
            ffmpeg -y -framerate 25 -i "/tmp/alfheim/native/cam${cam}.h264" -c:v libx264 -preset ultrafast -crf 22 -pix_fmt yuv420p "/tmp/alfheim/native/cam${cam}.mp4"
          done
          $CURL 'https://datasets.simula.no/downloads/alfheim/2013-11-03/zxy/2013-11-03_tromso_stromsgodset_first.csv' -o /tmp/alfheim/native/truth.csv
          test -s /tmp/alfheim/native/truth.csv

      - name: Run CENTELLA V23 temporal-fusion benchmark
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python vision_v1/alfheim_benchmark_v23_temporal_fusion.py \
            --cam0 /tmp/alfheim/native/cam0.mp4 \
            --cam1 /tmp/alfheim/native/cam1.mp4 \
            --cam2 /tmp/alfheim/native/cam2.mp4 \
            --truth /tmp/alfheim/native/truth.csv \
            --out output/alfheim \
            --sample-fps 8.0 \
            --calibration-seconds 10.0 \
            --model yolo11n.pt | tee output/alfheim/run.log
          cat output/alfheim/metrics.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: centella-alfheim-v23-temporal-fusion
          path: output/alfheim/
          if-no-files-found: warn
          retention-days: 14
