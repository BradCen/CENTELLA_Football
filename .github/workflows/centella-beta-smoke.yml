name: CENTELLA Beta Smoke

on:
  push:
    branches:
      - agent/centella-first-impression
  workflow_dispatch:

jobs:
  beta-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install shell dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame==2.6.1

      - name: Compile all CENTELLA Python modules
        run: python -m compileall -q centella

      - name: Import beta modules
        run: |
          python - <<'PY'
          import centella.settings
          import centella.content
          import centella.controller
          import centella.modes
          import centella.runtime
          import centella.ui
          import centella.audio
          import centella.beta_frontend
          import centella.product_frontend
          print('IMPORTS OK')
          PY

      - name: Validate bundled PNG assets
        run: |
          python - <<'PY'
          import pathlib
          import pygame
          pygame.init()
          pygame.display.set_mode((16, 16))
          root = pathlib.Path('centella/assets')
          for path in sorted(root.glob('*.png')):
              image = pygame.image.load(str(path))
              assert image.get_width() > 0 and image.get_height() > 0, path
              print('PNG OK', path, image.get_size())
          pygame.quit()
          PY

      - name: Headless UI render smoke test
        run: |
          python - <<'PY'
          import pygame
          from centella.product_frontend import App
          from centella.controller import InputAction
          from centella.modes import MODES

          app = App()
          app.render()
          app.handle_action(InputAction('confirm'))
          assert app.scene == 'hub'
          app.render()

          for tab_index in range(5):
              app.set_tab(tab_index)
              assert MODES[app.tab_name]
              app.render()

          scenes = [
              'quick', 'coop', 'training', 'career', 'street', 'journey',
              'online', 'edit', 'player', 'tournament', 'setpiece', 'controls',
              'video', 'access', 'workshop', 'doctor', 'detail', 'prematch'
          ]
          for scene in scenes:
              if scene == 'detail':
                  app.detail_mode = MODES['PLAY'][5]
              app.enter(scene)
              app.render()
              print('SCENE OK', scene)

          app.set_tab(1)
          app.open_mode(MODES['PLAY'][0])
          assert app.scene == 'quick'
          app.handle_action(InputAction('down'))
          app.handle_action(InputAction('right'))
          app.render()

          pygame.quit()
          print('UI SMOKE OK')
          PY
