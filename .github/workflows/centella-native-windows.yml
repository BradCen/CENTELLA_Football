name: CENTELLA Native Windows

on:
  push:
    branches:
      - agent/centella-first-impression
    paths:
      - 'setup.py'
      - 'gfootball/**'
      - 'third_party/gfootball_engine/**'
      - '.github/workflows/centella-native-windows.yml'
  workflow_dispatch:

jobs:
  native-engine:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.10'
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_FEATURE_FLAGS: 'versions'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.10 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
          architecture: 'x64'

      - name: Prepare packaging runtime
        shell: pwsh
        run: |
          python -m pip install 'pip==23.2.1' 'setuptools==65.5.0' 'wheel==0.38.4' psutil
          python -c "import struct,sys; print(sys.version); print('bits', struct.calcsize('P')*8)"

      - name: Provide current pkg-config for legacy vcpkg
        shell: pwsh
        run: |
          $pkg = Get-Command pkg-config.exe -ErrorAction SilentlyContinue
          if (-not $pkg) {
            choco install pkgconfiglite -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'pkg-config installation failed' }
            $chocoBin = Join-Path $env:ChocolateyInstall 'bin'
            $chocoBin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$chocoBin;$env:PATH"
            $pkg = Get-Command pkg-config.exe -ErrorAction SilentlyContinue
          }
          if (-not $pkg) { throw 'pkg-config.exe is not available' }
          Write-Host "pkg-config: $($pkg.Source)"
          & $pkg.Source --version

      - name: Prepare GRF-era vcpkg toolchain
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'centella-vcpkg'
          $baseline = 'b18b17865cfb6bd24620a00f30691be6775abb96'
          git clone https://github.com/microsoft/vcpkg.git $root
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg clone failed' }
          git -C $root checkout $baseline
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg baseline checkout failed' }
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          "VCPKG_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $cache = Join-Path $env:RUNNER_TEMP 'centella-vcpkg-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $root 'vcpkg.exe') version
          git -C $root log -1 --oneline
          Get-Content third_party\gfootball_engine\vcpkg_manifests\py3.10\vcpkg.json

      - name: Install Python runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --no-build-isolation 'gym==0.21.0'
          python -m pip install 'numpy==1.26.4' 'absl-py<3,>=1.4' 'opencv-python==4.10.0.84' 'six<2,>=1.16' pygame==2.6.1

      - name: Build Gameplay Football engine
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $buildLog = Join-Path $env:RUNNER_TEMP 'centella-native-build.txt'
          python -m pip install -e . --no-build-isolation --no-deps -v 2>&1 | Tee-Object -FilePath $buildLog
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Host "Native build failed with exit code $exitCode. Full pip output is preserved in the workflow artifact."
            exit $exitCode
          }

      - name: Verify native module
        shell: pwsh
        run: |
          @'
          import importlib.util
          import pathlib
          import sys

          spec = importlib.util.find_spec('gfootball_engine')
          print('gfootball_engine spec:', spec)
          if spec is None:
              raise SystemExit('gfootball_engine module was not installed')
          root = pathlib.Path(spec.origin).resolve().parent
          native = sorted(root.glob('_gameplayfootball*.pyd'))
          print('native modules:', [p.name for p in native])
          if not native:
              raise SystemExit('native _gameplayfootball .pyd was not produced')
          print('python:', sys.version)
          print('NATIVE MODULE PRESENT')
          '@ | python -

      - name: Verify engine API
        shell: pwsh
        run: |
          @'
          import struct
          import gfootball
          import gfootball_engine
          print('gfootball:', gfootball.__file__)
          print('gfootball_engine:', gfootball_engine.__file__)
          print('64bit:', struct.calcsize('P') * 8)
          assert hasattr(gfootball_engine, 'GameEnv')
          assert hasattr(gfootball_engine, 'GameState')
          print('NATIVE ENGINE API OK')
          '@ | python -

      - name: Smoke real 11v11 match
        shell: pwsh
        run: |
          @'
          from gfootball.env import football_action_set
          import gfootball.env as football_env

          env = football_env.create_environment(
              env_name='11_vs_11_stochastic',
              representation='raw',
              rewards='scoring',
              render=False,
              number_of_left_players_agent_controls=1,
              number_of_right_players_agent_controls=0,
          )
          obs = env.reset()
          print('11V11 RESET OK', type(obs))
          done = False
          for step in range(120):
              obs, reward, done, info = env.step([football_action_set.action_idle])
              if done:
                  print('11V11 reached terminal state at step', step)
                  break
          env.close()
          print('11V11 STEP SMOKE OK', 'done=', done)
          '@ | python -

      - name: Collect native build logs
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'centella-native-logs'
          New-Item -ItemType Directory -Force $out | Out-Null
          $pipLog = Join-Path $env:RUNNER_TEMP 'centella-native-build.txt'
          if (Test-Path $pipLog) { Copy-Item $pipLog (Join-Path $out 'pip-native-build.txt') -Force }
          $manifest = 'third_party\gfootball_engine\build_win\vcpkg-manifest-install.log'
          if (Test-Path $manifest) { Copy-Item $manifest (Join-Path $out 'vcpkg-manifest-install.log') -Force }
          if ($env:VCPKG_ROOT -and (Test-Path (Join-Path $env:VCPKG_ROOT 'buildtrees'))) {
            Get-ChildItem (Join-Path $env:VCPKG_ROOT 'buildtrees') -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '(out|err)\.log$' } |
              ForEach-Object {
                $safe = ($_.FullName.Substring($env:VCPKG_ROOT.Length).TrimStart('\') -replace '[\\/:*?"<>|]', '_')
                Copy-Item $_.FullName (Join-Path $out $safe) -Force -ErrorAction SilentlyContinue
              }
          }

      - name: Upload native logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: centella-native-windows-logs
          path: ${{ runner.temp }}/centella-native-logs
          if-no-files-found: ignore
          retention-days: 7
