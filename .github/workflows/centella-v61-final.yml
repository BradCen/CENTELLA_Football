name: CENTELLA V61 Final Tracking Benchmark

on:
  push:
    branches: [centella-v24-football-intelligence]
    paths:
      - 'vision_v1/alfheim_benchmark_v56_oos_globaltrack.py'
      - 'vision_v1/alfheim_benchmark_v61_finaltrack.py'
      - 'vision_v1/alfheim_geometry_refine.py'
      - '.github/workflows/centella-v61-final.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vision_v1/alfheim_benchmark_v56_oos_globaltrack.py'
      - 'vision_v1/alfheim_benchmark_v61_finaltrack.py'
      - 'vision_v1/alfheim_geometry_refine.py'
      - '.github/workflows/centella-v61-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v61-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics scipy pandas opencv-python-headless

      - name: Acquire exact OOS segments 0059-0061
        shell: bash
        run: |
          set -euo pipefail
          BASE_HTTPS='https://datasets.simula.no/downloads/alfheim/2013-11-03/First%20Half'
          BASE_HTTP='http://home.ifi.uio.no/paalh/dataset/alfheim/2013-11-03/First%20Half'
          OUT='/tmp/native'
          mkdir -p "$OUT"

          valid_binary() {
            local f="$1"
            test -s "$f" || return 1
            ! grep -aoiE '<html|<!doctype|access denied|too many requests|rate limit exceeded|not found' "$f" | head -n 1 >/dev/null
          }

          fetch_first_valid() {
            local out="$1"; shift
            local url
            rm -f "$out"
            for url in "$@"; do
              echo "TRY $url"
              if curl -4 -k -fL --connect-timeout 15 --max-time 180 --retry 3 --retry-all-errors --retry-delay 3 "$url" -o "$out" && valid_binary "$out"; then
                echo "OK $url"
                return 0
              fi
              rm -f "$out"
            done
            echo "FAILED all sources for $out" >&2
            return 1
          }

          for cam in 0 1 2; do
            mkdir -p "$OUT/$cam"
            for spec in \
              '0059|0059_2013-11-03%2018%3A01%3A23.251115000.h264' \
              '0060|0060_2013-11-03%2018%3A01%3A26.252555000.h264' \
              '0061|0061_2013-11-03%2018%3A01%3A29.253030000.h264'; do
              seg="${spec%%|*}"
              href="${spec#*|}"
              fetch_first_valid \
                "$OUT/$cam/$seg.h264" \
                "$BASE_HTTPS/$cam/$href" \
                "$BASE_HTTP/$cam/$href" \
                "http://datasets.simula.no/downloads/alfheim/2013-11-03/First%20Half/$cam/$href"
            done
            cat "$OUT/$cam/0059.h264" "$OUT/$cam/0060.h264" "$OUT/$cam/0061.h264" > "$OUT/cam${cam}.h264"
            ffmpeg -y -loglevel error -f h264 -r 25 -i "$OUT/cam${cam}.h264" -c:v libx264 -preset ultrafast -crf 22 -pix_fmt yuv420p "$OUT/cam${cam}.mp4"
            test -s "$OUT/cam${cam}.mp4"
          done

          TRUTH='https://datasets.simula.no/downloads/alfheim/2013-11-03/zxy/2013-11-03_tromso_stromsgodset_first.csv'
          TRUTH_OLD='http://home.ifi.uio.no/paalh/dataset/alfheim/2013-11-03/zxy/2013-11-03_tromso_stromsgodset_first.csv'
          TRUTH_HTTP='http://datasets.simula.no/downloads/alfheim/2013-11-03/zxy/2013-11-03_tromso_stromsgodset_first.csv'
          fetch_first_valid "$OUT/truth.csv" "$TRUTH" "$TRUTH_OLD" "$TRUTH_HTTP"

      - name: Build image-only geometry models
        env:
          PYTHONPATH: vision_v1
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p output/alfheim_v61/geometry_models
          for spec in '0:/tmp/native/cam0.mp4' '1:/tmp/native/cam1.mp4' '2:/tmp/native/cam2.mp4'; do
            cam="${spec%%:*}"
            video="${spec#*:}"
            python vision_v1/alfheim_geometry_refine.py \
              --video "$video" \
              --cam "$cam" \
              --out output/alfheim_v61/geometry_models \
              --samples 6
          done

      - name: Run V61 final causal tracker
        env:
          PYTHONPATH: vision_v1
          PYTHONUNBUFFERED: '1'
        run: |
          python vision_v1/alfheim_benchmark_v61_finaltrack.py \
            --cam0 /tmp/native/cam0.mp4 \
            --cam1 /tmp/native/cam1.mp4 \
            --cam2 /tmp/native/cam2.mp4 \
            --truth /tmp/native/truth.csv \
            --geometry-dir output/alfheim_v61/geometry_models \
            --out output/alfheim_v61/final

      - name: Guard final benchmark integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/alfheim_v61/final/metrics.json')
          d=json.loads(p.read_text())
          assert d['inference_uses_ground_truth'] is False
          a=d['anonymous_tracking_diagnostics']
          f=d['framewise_geometry_evaluation']
          assert a['tracks_evaluated'] >= 5
          assert f['gt_points'] > 0
          print('V61 integrity guard passed')
          print('V61 anonymous:', a)
          print('V61 framewise:', f)
          print('V61 mapped:', d['calibration_mapped_holdout_evaluation'])
          PY

      - name: Upload V61 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: centella-alfheim-v61-final
          path: output/alfheim_v61/
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 6
