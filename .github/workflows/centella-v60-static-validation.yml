name: CENTELLA V60 Static Validation

on:
  push:
    branches: [centella-v24-football-intelligence]
    paths:
      - 'vision_v1/alfheim_benchmark_v56_oos_globaltrack.py'
      - 'vision_v1/alfheim_benchmark_v59_oos_trackset_consensus.py'
      - 'vision_v1/alfheim_geometry_audit.py'
      - 'vision_v1/alfheim_geometry_refine.py'
      - 'vision_v1/run_alfheim_v59_local.py'
      - '.github/workflows/centella-v60-static-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vision_v1/alfheim_benchmark_v56_oos_globaltrack.py'
      - 'vision_v1/alfheim_benchmark_v59_oos_trackset_consensus.py'
      - 'vision_v1/alfheim_geometry_audit.py'
      - 'vision_v1/alfheim_geometry_refine.py'
      - 'vision_v1/run_alfheim_v59_local.py'
      - '.github/workflows/centella-v60-static-validation.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile V56/V59/V60 Python modules
        run: |
          set -euo pipefail
          python -m py_compile \
            vision_v1/alfheim_benchmark_v56_oos_globaltrack.py \
            vision_v1/alfheim_benchmark_v59_oos_trackset_consensus.py \
            vision_v1/alfheim_geometry_audit.py \
            vision_v1/alfheim_geometry_refine.py \
            vision_v1/run_alfheim_v59_local.py
      - name: Verify no ground-truth reference in geometry-only modules
        run: |
          set -euo pipefail
          ! grep -nE 'truth_at|load_truth|TARGET_IDS|zxy|ground.?truth' vision_v1/alfheim_geometry_audit.py vision_v1/alfheim_geometry_refine.py
